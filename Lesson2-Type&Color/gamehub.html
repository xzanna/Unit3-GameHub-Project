<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>GameHub</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="site-header">
    <nav class="container nav" aria-label="Main">
      <a class="logo" href="#">GameHub</a>
      <ul class="nav-links">
        <li><a href="#features">Features</a></li>
        <li><a href="#about">About</a></li>
        <li><a href="#games">Games</a></li>
        <li><a href="#contact">Contact</a></li>
      </ul>
    </nav>
  </header>
  <main>
    <section class="hero">
      <div class="container hero-content">
        <h1>Play together</h1>
        <p class="tagline">One hub for every game night.</p>
        <div class="hero-buttons">
          <a class="btn btn-primary" href="#games">Get started</a>
          <a class="btn btn-secondary" href="#about">Learn more</a>
        </div>
      </div>
    </section>
    <section id="features" class="container"><h2>Features</h2><h3>Co-op</h3><p>Team up with friends.</p></section>
    <section id="about" class="container"><h2>About</h2><p>Made by players, for players.</p></section>
    <section id="games" class="container"><h2>Games</h2><p>Pick a game and jump in.</p></section>
  </main>
  <footer id="contact" class="container"><p>Contact us anytime.</p></footer>
  <script src="check.js"></script>
</body>
</html>
